<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thuis · TV-startscherm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#FFFFFF;
    --ink-2:rgba(255,255,255,.78);
    --ink-3:rgba(255,255,255,.56);
    --live:#FF4B4B;
    --card-r:14px;
    --ease:cubic-bezier(.2,.7,.2,1);
    --display:'Inter Tight',Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;transform-origin:center center;flex:none;background:#05070a}

  .bd{position:absolute;inset:0;background-size:cover;background-position:center right;opacity:0;transition:opacity .7s var(--ease), transform 8s linear;transform:scale(1.02)}
  .bd.on{opacity:1;transform:scale(1.06)}
  .scrim{position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(90deg, rgba(4,6,10,.92) 0%, rgba(4,6,10,.72) 28%, rgba(4,6,10,.15) 62%, rgba(4,6,10,0) 80%),
      linear-gradient(180deg, rgba(4,6,10,.55) 0%, rgba(4,6,10,0) 18%, rgba(4,6,10,0) 42%, rgba(4,6,10,.78) 66%, rgba(4,6,10,.96) 100%);}

  .top{position:absolute;left:96px;right:96px;top:44px;display:flex;align-items:center;justify-content:space-between;z-index:5}
  .nav{display:flex;gap:8px}
  .pill{font:600 26px/1 Inter,system-ui,sans-serif;color:var(--ink-2);padding:14px 26px;border-radius:999px;border:none;background:transparent;cursor:pointer;transition:background .18s,color .18s,transform .18s var(--ease)}
  .pill.cur{color:var(--ink)}
  .pill.cur::after{content:"";display:block;height:3px;border-radius:2px;background:var(--ink);margin:8px auto 0;width:24px}
  .pill.focus{background:var(--ink);color:#05070a;transform:scale(1.06)}
  .pill.focus::after{background:#05070a}
  .status{display:flex;align-items:center;gap:28px;font:500 28px/1 Inter,system-ui,sans-serif;color:var(--ink-2)}
  .clock{font:600 34px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}

  .hero{position:absolute;left:96px;top:170px;width:1100px;z-index:4}
  .src{display:flex;align-items:center;gap:12px;font:700 22px/1 Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
  .src i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .src .live{background:var(--live);color:#fff;letter-spacing:.1em;padding:6px 10px;border-radius:6px;font-size:20px}
  .title{font:700 80px/1.05 var(--display);letter-spacing:-.025em;margin:20px 0;max-width:1100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;font:500 26px/1 Inter,system-ui,sans-serif;color:var(--ink-2);min-height:26px}
  .meta .sep{width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
  .meta .tag{border:2px solid rgba(255,255,255,.5);border-radius:6px;padding:4px 9px;font-size:20px;font-weight:700;letter-spacing:.04em;color:var(--ink)}
  .desc{font:400 28px/1.45 Inter,system-ui,sans-serif;color:var(--ink-2);margin:24px 0 0;max-width:760px;min-height:81px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cta{display:flex;align-items:center;gap:14px;margin-top:30px;font:600 26px/1 Inter,system-ui,sans-serif;color:var(--ink)}
  .cta b{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:#05070a;border-radius:999px;padding:10px 18px;font-size:22px;letter-spacing:.06em}
  .bar{width:180px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
  .bar>span{display:block;height:100%;background:var(--ink)}

  .rows{position:absolute;left:0;right:0;top:620px;z-index:4;transition:transform .45s var(--ease)}
  .row{height:340px;transition:opacity .35s var(--ease)}
  .row.above{opacity:0}
  .row.dim .track{opacity:.55}
  .rtitle{margin-left:96px;font:600 28px/1 Inter,system-ui,sans-serif;color:var(--ink);height:46px;margin-bottom:20px;display:flex;align-items:center;gap:14px}
  .rtitle small{font:500 22px/1 Inter,system-ui,sans-serif;color:var(--ink-3)}
  .viewport{overflow:visible;padding-left:96px}
  .track{display:flex;gap:28px;transition:transform .35s var(--ease), opacity .3s}
  .card{position:relative;flex:none;width:400px;height:225px;border-radius:var(--card-r);background:#111 center/cover no-repeat;border:none;padding:0;cursor:pointer;color:var(--ink);text-align:left;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .2s var(--ease), box-shadow .2s, outline-color .2s, opacity .25s;outline:4px solid transparent;outline-offset:0}
  .card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.75) 100%)}
  .card.focus{transform:scale(1.08);outline-color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.6);z-index:2}
  .card .badge{position:absolute;left:18px;bottom:18px;font:700 18px/1 Inter,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
  .card .prog{position:absolute;left:18px;right:18px;bottom:8px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
  .card .prog>span{display:block;height:100%;background:var(--ink)}
  .card .ch{position:absolute;left:18px;top:16px;right:90px;display:flex;align-items:center;gap:12px;font:700 28px/1 var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden}
  .card .ch img{height:44px;max-width:88px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
  .card .ldot{position:absolute;right:16px;top:16px;font:700 16px/1 Inter,system-ui,sans-serif;letter-spacing:.1em;background:var(--live);padding:6px 9px;border-radius:5px}
  .card .now{position:absolute;left:18px;right:18px;bottom:24px;font:600 24px/1.2 Inter,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card.app{width:260px;height:146px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background-color:#151922}
  .card.app::before{display:none}
  .card.app span{font:700 26px/1.1 var(--display);letter-spacing:-.01em;text-align:center;padding:0 12px}
  .card.app img{width:64px;height:64px}

  .card.svc{width:260px;height:146px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background-image:none}
  .card.svc::before{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.25))}
  .card.svc img{width:72px;height:72px;border-radius:16px;position:relative}
  .card.svc span{position:relative;font:700 24px/1 var(--display);letter-spacing:-.01em}
  .card.svc .via{position:absolute;right:12px;top:10px;font:700 14px/1 Inter,system-ui,sans-serif;letter-spacing:.08em;opacity:.85}
  .toast{position:absolute;left:50%;bottom:64px;transform:translate(-50%,20px);opacity:0;background:rgba(255,255,255,.95);color:#05070a;font:600 28px/1 Inter,system-ui,sans-serif;padding:20px 34px;border-radius:999px;transition:all .3s var(--ease);z-index:9;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* instellingen */
  .sheet{position:absolute;inset:0;z-index:20;background:rgba(4,6,10,.86);display:flex;align-items:center;justify-content:center}
  .sheet[hidden]{display:none}
  .sheet-in{width:1100px;max-height:1000px;overflow-y:auto;background:#10141b;border-radius:24px;padding:56px 64px;box-shadow:0 40px 120px rgba(0,0,0,.6)}
  .sheet h2{font:700 52px/1 var(--display);margin:0 0 14px}
  .sheet .hint{font:400 26px/1.4 Inter,system-ui,sans-serif;color:var(--ink-2);margin:0 0 34px}
  .field{display:grid;grid-template-columns:330px 1fr;align-items:center;gap:24px;margin-bottom:18px;font:600 26px/1 Inter,system-ui,sans-serif;color:var(--ink-2)}
  .field input,.field .btn{font:500 28px/1 Inter,system-ui,sans-serif}
  .field input{background:#1b212b;border:3px solid transparent;border-radius:12px;color:var(--ink);padding:16px 18px;outline:none;width:100%}
  .btns{display:flex;gap:16px;margin-top:30px}
  .btn{white-space:nowrap;background:#1b212b;color:var(--ink);border:3px solid transparent;border-radius:999px;padding:16px 30px;font:600 26px/1 Inter,system-ui,sans-serif;cursor:pointer}
  .btn.pri{background:#e9edf3;color:#05070a}
  .sf{border-color:var(--ink)!important;transform:scale(1.03)}
  .field .btn{justify-self:start}
  .status-line{margin-top:26px;font:500 26px/1.4 Inter,system-ui,sans-serif;color:var(--ink-2);min-height:36px}
</style>
</head>
<body>
<div id="stage" role="application" aria-label="TV-startscherm. Gebruik de pijltjestoetsen en OK.">
  <div class="bd" id="bdA"></div>
  <div class="bd" id="bdB"></div>
  <div class="scrim"></div>

  <div class="top">
    <nav class="nav" id="nav" aria-label="Hoofdmenu"></nav>
    <div class="status"><span class="clock" id="clock">--:--</span></div>
  </div>

  <section class="hero" id="hero" aria-live="polite">
    <div class="src" id="hSrc"></div>
    <h1 class="title" id="hTitle"></h1>
    <div class="meta" id="hMeta"></div>
    <p class="desc" id="hDesc"></p>
    <div class="cta" id="hCta"></div>
  </section>

  <div class="rows" id="rows"></div>
  <div class="toast" id="toast" role="status"></div>

  <div class="sheet" id="settings" hidden>
    <div class="sheet-in">
      <h2>Instellingen</h2>
      <p class="hint">Live tv loopt via Dispatcharr met een Xtream Codes-login. Dat zijn dezelfde gegevens als in MYTVOnline.</p>
      <label class="field">Server<input id="sServer" placeholder="http://192.168.40.10:9191" autocomplete="off" spellcheck="false"></label>
      <label class="field">Gebruikersnaam<input id="sUser" autocomplete="off" spellcheck="false"></label>
      <label class="field">Wachtwoord<input id="sPass" type="password" autocomplete="off"></label>
      <div class="field">Streamformaat<button class="btn" id="sFormat" type="button">ts</button></div>
      <label class="field">Categorieën<input id="sGroup" placeholder="leeg = alle, of bijv. sport, docu" autocomplete="off" spellcheck="false"></label>
      <label class="field">TMDB-sleutel<input id="sTmdb" placeholder="voor de rij Voor jou" autocomplete="off" spellcheck="false"></label>
      <label class="field">Plex-adres<input id="sPlexUrl" placeholder="http://192.168.x.x:32400" autocomplete="off" spellcheck="false"></label>
      <label class="field">Plex-token<input id="sPlexTok" type="password" autocomplete="off"></label>
      <label class="field">Jellyfin-adres<input id="sJfUrl" placeholder="http://192.168.x.x:8096" autocomplete="off" spellcheck="false"></label>
      <label class="field">Jellyfin-sleutel<input id="sJfKey" type="password" autocomplete="off"></label>
      <label class="field">JBL-webhook<input id="sJbl" placeholder="Home Assistant-webhook (optioneel)" autocomplete="off" spellcheck="false"></label>
      <div class="btns">
        <button class="btn" id="sTest" type="button">Verbinding testen</button>
        <button class="btn pri" id="sSave" type="button">Opslaan</button>
        <button class="btn" id="sClose" type="button">Sluiten</button>
        <button class="btn" id="sAndroid" type="button">Systeeminstellingen</button>
      </div>
      <div class="btns">
        <button class="btn" id="sUpdate" type="button">Bijwerken</button>
        <span class="status-line" id="sVersion" style="margin:0;align-self:center"></span>
      </div>
      <div class="status-line" id="sStatus"></div>
    </div>
  </div>
</div>

<script>
(function(){
  // Platformlaag: Android (Formuler) via window.Native, Samsung (Tizen) en andere later via window.ThuisPlatform.
  // Zonder platform draait de pagina met voorbeelddata (handig in de browser).
  var PL = null;
  var cbs = {}, cbn = 0;
  window.__nativeCb = function(id, ok, payload){ var f = cbs[id]; delete cbs[id]; if (f) f(ok, payload); };
  function call(method, done){ var id = ++cbn; cbs[id] = done; Native[method].apply(Native, [id].concat([].slice.call(arguments, 2))); }
  try {
    if (window.Native && Native.isApp && Native.isApp()) PL = {
      name: 'android',
      liveCategories: function(cb){ call('liveCategories', cb); },
      liveCategory: function(catId, cb){ call('liveCategory', cb, catId); },
      apps: function(cb){ call('getApps', cb); },
      test: function(cb){ call('testConnection', cb); },
      getSettings: function(){ return JSON.parse(Native.getSettings()); },
      saveSettings: function(o){ Native.saveSettings(JSON.stringify(o)); },
      play: function(id, cat){ if (cat) Native.playInCategory(id, String(cat)); else Native.playChannel(id); },
      playLast: function(){ Native.playLast(); },
      launch: function(id){ Native.launch(id); },
      systemSettings: function(){ Native.openAndroidSettings(); },
      checkUpdate: function(cb){ call('checkUpdate', cb); },
      streamingHome: function(cb){ call('streamingHome', cb); },
      continueWatching: function(cb){ call('continueWatching', cb); },
      openMedia: function(src, key){ Native.openMedia(src, key); },
      jbl: function(pkg, cb){ call('jblLaunch', cb, pkg); },
      installUpdate: function(cb){ call('installUpdate', cb); }
    };
  } catch (e) {}
  if (!PL && window.ThuisPlatform) PL = window.ThuisPlatform;
  var APP = !!PL;

  var IMG = 'img/';
  var IMGS = ['city','forest','dunes','neon','ocean','peaks','coast','aurora'];
  var SRC = {
    plex:{n:'Plex',c:'#E5A00D'}, netflix:{n:'Netflix',c:'#E50914'}, prime:{n:'Prime Video',c:'#1FA2E0'},
    videoland:{n:'Videoland',c:'#E3007A'}, sky:{n:'SkyShowtime',c:'#7B5CFF'}, youtube:{n:'YouTube',c:'#FF2D2D'},
    npo:{n:'NPO Start',c:'#FF7A00'}, ziggo:{n:'Ziggo',c:'#F48C00'}, iptv:{n:'Live tv',c:'#3DDBB0'}, app:{n:'App',c:'#9AA4B2'}
  };

  var SAMPLE_CONT = [
    { t:'Noorderlicht', s:'plex', kind:'Serie', img:'aurora', meta:['2025','S1 · afl. 4','52 min'], tag:'4K HDR', p:.62, left:'nog 20 min', sample:true,
      d:'Een onderzoeksteam overwintert op een basis in het hoge noorden. Als de verbinding met de buitenwereld wegvalt, wordt het stil. Te stil.' },
    { t:'De Laatste Veerboot', s:'videoland', kind:'Film', img:'ocean', meta:['2024','1u 48m'], tag:'HD', p:.35, left:'nog 1u 10m', sample:true,
      d:'Een schipper vaart zijn laatste avonddienst naar het eiland. Aan boord zitten zeven passagiers die allemaal een reden hebben om niet terug te gaan.' },
    { t:'Stad zonder Slaap', s:'netflix', kind:'Serie', img:'city', meta:['2026','S2 · afl. 1','47 min'], tag:'4K', p:.8, left:'nog 9 min', sample:true,
      d:'Nachtleven, nachtdiensten en nachtelijke deals in één stad die nooit uitgaat. Tweede seizoen.' },
    { t:'Mist over Drenthe', s:'npo', kind:'Docu', img:'forest', meta:['2025','58 min'], tag:'HD', p:.1, left:'nog 52 min', sample:true,
      d:'Een jaar in de laatste oude bossen van Drenthe, van herfstmist tot de eerste vorst.' }
  ];
  var SAMPLE_LIVE = [
    { t:'Avondjournaal', ch:'NPO 1', s:'iptv', kind:'Nieuws', img:'city', meta:['21:00 tot 21:30'], p:.45, next:'Daarna: Op1', d:'Het nieuws van de dag, met achtergronden en het weer.' },
    { t:'Veldrit: wereldbeker', ch:'Ziggo Sport', s:'iptv', kind:'Sport', img:'forest', meta:['20:30 tot 22:00'], p:.5, next:'Daarna: Rondo', d:'Samenvatting en de laatste ronde live.' },
    { t:'Woestijnroutes', ch:'Discovery', s:'iptv', kind:'Docu', img:'dunes', meta:['21:00 tot 22:00'], p:.25, next:'Daarna: Gold Rush', d:'Twee chauffeurs rijden de langste zandroute van het continent.' },
    { t:'Stand-up avond', ch:'Comedy Central', s:'iptv', kind:'Comedy', img:'neon', meta:['21:00 tot 22:00'], p:.3, next:'Daarna: South Park', d:'Vier comedians, één podium en geen vangnet.' }
  ];
  var SAMPLE_REC = [
    { t:'Hoogland', s:'sky', kind:'Serie', img:'peaks', meta:['2026','6 afleveringen'], tag:'4K', p:0, sample:true, d:'Een reddingsteam in de bergen krijgt in één winter meer meldingen dan in de tien jaar ervoor.' },
    { t:'Zoutvlakte', s:'prime', kind:'Film', img:'dunes', meta:['2025','2u 04m'], tag:'4K HDR', p:0, sample:true, d:'Een geologe vindt midden in de woestijn iets wat daar niet hoort te liggen.' },
    { t:'Neonregen', s:'netflix', kind:'Serie', img:'neon', meta:['2026','8 afleveringen'], tag:'4K', p:0, sample:true, d:'Een privédetective in een stad waar het nooit ophoudt met regenen.' },
    { t:'Kustlicht', s:'videoland', kind:'Serie', img:'coast', meta:['2025','S1'], tag:'HD', p:0, sample:true, d:'Een familie runt al drie generaties het enige hotel aan de kust. Dit voorjaar loopt het mis.' }
  ];
  var SERVICES = [{"key": "netflix", "name": "Netflix", "provider": 8, "color": "#E50914", "logo": "/rK1KljqmbvO9HQa1PBFLILWah72.png", "match": "netflix", "jbl": "com.netflix.ninja", "forceJbl": true}, {"key": "prime", "name": "Prime Video", "provider": 119, "color": "#1A98FF", "logo": "/gMZdpavHmxFNnLpMHwVxfqeux2g.png", "match": "prime"}, {"key": "videoland", "name": "Videoland", "provider": 72, "color": "#E6007E", "logo": "/3IdfSLRjSoDoo9lrpvX4oxZmnVi.png", "match": "videoland", "jbl": "nl.rtl.videoland.v2"}, {"key": "skyshowtime", "name": "SkyShowtime", "provider": 1773, "color": "#6E3CF5", "logo": "/ube1pVpP3FklRkeyQjlDkkC3tL2.png", "match": "skyshowtime", "jbl": "com.skyshowtime.skyshowtime.google"}, {"key": "withlove", "name": "WithLove", "color": "#C2185B", "match": "withlove", "jbl": "nl.withlove.app"}, {"key": "youtube", "name": "YouTube", "color": "#FF0033", "match": "youtube"}, {"key": "npo", "name": "NPO Start", "provider": 360, "color": "#FF6D00", "logo": "/iVAJklPcCjj15989GVJufXqsVtS.png", "match": "npo"}, {"key": "plex", "name": "Plex", "provider": 538, "color": "#E5A00D", "logo": "/blAEhvx3XX8sV0fFVFk88FFjubs.png", "match": "plex"}];
  var SVC = {}; SERVICES.forEach(function(x){ SVC[x.key] = x; });
  var TMDB_IMG = 'https://image.tmdb.org/t/p/';
  function loadRecent(){ try { return JSON.parse(localStorage.getItem('thuis.recent') || '[]'); } catch (e) { return []; } }
  function saveRecent(list){ try { localStorage.setItem('thuis.recent', JSON.stringify(list.slice(0, 10))); } catch (e) {} }
  var SAMPLE_APPS = ['Plex','Netflix','Prime Video','Videoland','SkyShowtime','YouTube','NPO Start','Ziggo GO'].map(function(n,i){
    return { t:n, s:'app', img:IMGS[i % IMGS.length], d:'' };
  });

  var data = { cont: SAMPLE_CONT, live: APP ? [{ t:'Zenders laden…', ch:'Live tv', s:'iptv', kind:'Live tv', img:'aurora', meta:[], p:0, d:'', loading:true }] : SAMPLE_LIVE,
               rec: SAMPLE_REC, apps: SAMPLE_APPS, liveSub: 'Dispatcharr', ziggo: null };
  data.channels = data.live;
  data.recent = loadRecent();
  data.media = [];
  data.picks = [];
  data.svcBd = {};
  if (!APP) { data.cats = SAMPLE_CATS; data.picks = SAMPLE_REC.map(function(x){ var y = {}; for (var k in x) y[k] = x[k]; y.s = 'pick'; y.service = x.s === 'sky' ? 'skyshowtime' : x.s; return y; }); }

  // Vaste tegel voor Ziggo GO vooraan in "Nu live" (handig als de ene IPTV-stream al in gebruik is).
  function composeLive(){
    var list = (data.cats || data.channels).slice();
    if (data.ziggo) list.unshift({ t:'Ziggo GO', ch:'Ziggo GO', s:'ziggo', kind:'App', img:'city', meta:['Live tv en terugkijken van Ziggo'], p:0,
      d:'Opent de app van Ziggo. Gebruik deze als de IPTV-stream al ergens anders speelt, of voor terugkijken van Ziggo.', app:true, pkg:data.ziggo });
    data.live = list;
  }
  var ROWS = [];
  var NAV = ['Thuis','Live tv','Apps','Instellingen'];
  var state = { row:0, col:[0,0,0,0], nav:false, navIdx:0, view:'home', cat:null, home:null };
  function catImg(name, i){
    var n = (name || '').toLowerCase();
    if (/sport|voetbal|wieler|f1|basket/.test(n)) return 'forest';
    if (/docu|discovery|natuur|national/.test(n)) return 'dunes';
    if (/muziek|music|mtv|radio/.test(n)) return 'neon';
    if (/film|movie|cinema|serie/.test(n)) return 'ocean';
    if (/nieuws|news|standaard|algemeen|nl/.test(n)) return 'city';
    return IMGS[i % IMGS.length];
  }
  var SAMPLE_CATS = [['Standaard',42],['Sport',37],['Docu',14],['Muziek',9]].map(function(c, i){
    return { t:c[0], ch:c[0], s:'iptv', kind:'Categorie', img:catImg(c[0], i), meta:[c[1] + ' zenders'], p:0, count:c[1], cat:'s' + i,
             d:'Voorbeeldcategorie. In de app komen hier je groepen uit Dispatcharr.' };
  });
  var $ = function(id){ return document.getElementById(id); };
  var stage = $('stage');

  function hm(ms){ var d = new Date(ms); return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); }

  function fit(){
    var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();

  function tick(){ $('clock').textContent = hm(Date.now()); }
  tick(); setInterval(tick, 10000);

  IMGS.forEach(function(n){ var i = new Image(); i.src = IMG+n+'.jpg'; });


  // ---------- navigatie ----------
  NAV.forEach(function(n,i){
    var b = document.createElement('button');
    b.className = 'pill' + (i===0?' cur':'');
    b.textContent = n;
    b.addEventListener('click', function(){ state.nav = true; state.navIdx = i; render(); enter(); });
    $('nav').appendChild(b);
  });

  // ---------- rijen ----------
  var rowEls = [];
  function rowDefs(){
    if (state.view === 'cat' && data.catGroups) {
      return data.catGroups.map(function(g){ return { title:g.name, sub:g.items.length + ' zenders', type:'live', items:g.items }; });
    }
    if (state.view === 'cat') {
      var ch = data.catChannels || [], rows = [];
      for (var i = 0; i < Math.max(1, ch.length); i += 4) {
        rows.push({ title: i === 0 ? state.cat.t : '', sub: i === 0 ? (data.catSub || '') : '', type:'live', grid:true, items: ch.slice(i, i + 4) });
      }
      return rows;
    }
    if (state.view === 'apps') {
      var ap = data.apps, arows = [];
      for (var a = 0; a < ap.length; a += 6) arows.push({ title: a === 0 ? 'Alle apps' : '', sub: a === 0 ? ap.length + ' apps' : '', type:'app', grid:true, items: ap.slice(a, a + 6) });
      return arows;
    }
    var home = [];
    var cont = (data.media || []).concat(data.recent);
    if (cont.length) home.push({ title:'Verder kijken', sub: (data.media && data.media.length) ? 'Netflix · Plex · Jellyfin en meer' : 'laatst geopend', type:'cont', items:cont });
    home.push({ title:'Live tv', sub:data.liveSub, type:'live', items:data.live });
    home.push({ title:'Streamingdiensten', sub:'', type:'svc', items:svcItems() });
    if (data.picks.length) home.push({ title:'Voor jou', sub:'populair op jouw diensten', type:'pick', items:data.picks });
    return home;
    return [
      { title:'Verder kijken', sub: APP ? 'voorbeeld, Plex volgt' : 'uit al je diensten', type:'cont', items:data.cont },
      { title:'Live tv', sub:data.liveSub, type:'live', items:data.live },
      { title:'Aanbevolen voor jou', sub: APP ? 'voorbeeld' : 'Netflix · Prime · SkyShowtime · Videoland', type:'rec', items:data.rec },
      { title:'Apps', sub:'', type:'app', items:data.apps }
    ];
  }

  function buildRows(){
    ROWS = rowDefs();
    var host = $('rows'); host.innerHTML = ''; rowEls = [];
    ROWS.forEach(function(r, ri){
      var row = document.createElement('div'); row.className = 'row';
      var h = document.createElement('div'); h.className = 'rtitle';
      var hs = document.createElement('span'); hs.textContent = r.title; h.appendChild(hs);
      var hm2 = document.createElement('small'); hm2.textContent = r.sub; h.appendChild(hm2);
      var vp = document.createElement('div'); vp.className = 'viewport';
      var tr = document.createElement('div'); tr.className = 'track';
      r.items.forEach(function(it, ci){ tr.appendChild(card(r, it, ri, ci)); });
      vp.appendChild(tr); row.appendChild(h); row.appendChild(vp);
      host.appendChild(row);
      rowEls.push({ row:row, track:tr, w: r.grid ? 0 : ((r.type==='app' || r.type==='svc') ? 288 : 428), grid: !!r.grid });
      if (state.col[ri] === undefined) state.col[ri] = 0;
      if (state.col[ri] > r.items.length - 1) state.col[ri] = Math.max(0, r.items.length - 1);
    });
    render();
  }

  function localApp(sv){
    var m = (sv.match || '').toLowerCase();
    return data.apps.filter(function(a){ return a.pkg && m && a.t.toLowerCase().indexOf(m) >= 0; })[0];
  }
  function viaJbl(sv){ return !!sv.jbl && (sv.forceJbl || !localApp(sv)); }
  function svcItems(){
    return SERVICES.map(function(sv, i){
      var top = data.svcBd[sv.key];
      return { t:sv.name, s:'svc', key:sv.key, color:sv.color, logo: sv.logo ? TMDB_IMG + 'w154' + sv.logo : '',
               img: top ? top.backdrop : IMGS[i % IMGS.length], kind:'Streamingdienst',
               meta: top ? ['Populair nu: ' + top.title] : [], d: top ? top.overview : '', jbl: viaJbl(sv) };
    });
  }
  function openService(key, recentItem){
    var sv = SVC[key]; if (!sv) return;
    if (recentItem) {
      var list = loadRecent().filter(function(x){ return x.t !== recentItem.t; });
      list.unshift({ t:recentItem.t, s:'cont', service:key, img:recentItem.img, thumb:recentItem.thumb, kind:recentItem.kind, meta:recentItem.meta, d:recentItem.d });
      saveRecent(list); data.recent = list.slice(0, 10);
    }
    if (!APP) { toast(sv.name + ' wordt geopend'); return; }
    if (viaJbl(sv)) {
      if (!PL.jbl) { toast(sv.name + ' staat op de JBL'); return; }
      PL.jbl(sv.jbl, function(ok, msg){ toast(ok ? sv.name + ' opent op de JBL' : sv.name + ' staat op de JBL: ' + msg); });
      return;
    }
    var a = localApp(sv);
    if (a) PL.launch(a.pkg); else toast(sv.name + ' is niet geïnstalleerd');
  }

  function card(r, it, ri, ci){
    var b = document.createElement('button');
    b.className = 'card' + (r.type==='app' ? ' app' : '');
    b.setAttribute('aria-label', (it.ch ? it.ch+', ' : '') + it.t);
    if (r.type === 'svc') {
      b.className = 'card svc';
      b.style.backgroundColor = it.color;
      if (it.logo) { var lgo = document.createElement('img'); lgo.src = it.logo; lgo.alt = ''; lgo.onerror = function(){ lgo.remove(); }; b.appendChild(lgo); }
      var nm = document.createElement('span'); nm.textContent = it.t; b.appendChild(nm);
      if (it.jbl) { var v = document.createElement('i'); v.className = 'via'; v.textContent = 'JBL'; b.appendChild(v); }
    } else if (r.type === 'app') {
      if (it.banner) {
        b.style.backgroundImage = 'url(' + it.banner + ')';
        b.style.backgroundSize = 'cover';
      } else {
        if (it.icon) { var im = document.createElement('img'); im.src = it.icon; im.alt = ''; b.appendChild(im); }
        var sp = document.createElement('span'); sp.textContent = it.t; b.appendChild(sp);
      }
    } else {
      b.style.backgroundImage = 'url(' + (it.thumb || (IMG + it.img + '-s.jpg')) + ')';
      if (r.type === 'live') {
        var ch = document.createElement('span'); ch.className = 'ch';
        if (it.logo) {
          var lg = document.createElement('img'); lg.src = it.logo; lg.alt = '';
          lg.onerror = function(){ lg.remove(); };
          ch.appendChild(lg);
        }
        ch.appendChild(document.createTextNode(it.ch || ''));
        b.appendChild(ch);
        if (it.cat) b.insertAdjacentHTML('beforeend','<span class="ldot" style="background:rgba(255,255,255,.22)">' + it.count + '</span>');
        else if (it.app) b.insertAdjacentHTML('beforeend','<span class="ldot" style="background:#F48C00">APP</span>');
        else if (!it.setup && !it.loading) b.insertAdjacentHTML('beforeend','<span class="ldot">LIVE</span>');
        var now = document.createElement('span'); now.className = 'now'; now.textContent = it.app ? 'Live tv en terugkijken' : (it.cat ? it.count + ' zenders' : it.t); b.appendChild(now);
        if (it.p > 0) { b.insertAdjacentHTML('beforeend','<span class="prog"><span></span></span>'); b.querySelector('.prog>span').style.width = Math.round(it.p*100)+'%'; }
      } else {
        var bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = it.media ? (it.media === 'plex' ? 'Plex' : it.media === 'jellyfin' ? 'Jellyfin' : (SVC[it.service] ? SVC[it.service].name : 'JBL')) : (it.service && SVC[it.service] ? SVC[it.service].name : (SRC[it.s] ? SRC[it.s].n : '')); b.appendChild(bd);
        if (it.p > 0) {
          b.insertAdjacentHTML('beforeend','<span class="prog"><span></span></span>');
          b.querySelector('.prog>span').style.width = Math.round(it.p*100)+'%';
          bd.style.bottom = '24px';
        }
      }
    }
    b.addEventListener('click', function(){
      var same = !state.nav && state.row===ri && state.col[ri]===ci;
      state.nav = false; state.row = ri; state.col[ri] = ci; render();
      if (same) enter();
    });
    return b;
  }

  // ---------- achtergrond ----------
  var bdA = $('bdA'), bdB = $('bdB'), front = bdA, curImg = null, bdTimer = null;
  function setBackdrop(name){
    if (!name || name === curImg) return;
    clearTimeout(bdTimer);
    bdTimer = setTimeout(function(){
      curImg = name;
      var back = front === bdA ? bdB : bdA;
      back.style.backgroundImage = 'url(' + (/^https?:/.test(name) ? name : IMG + name + '.jpg') + ')';
      back.classList.add('on'); front.classList.remove('on');
      front = back;
    }, 220);
  }

  // ---------- hero ----------
  function hero(it, type){
    var src = SRC[it.s] || SRC.app;
    function mediaName(x){ return x.media === 'plex' ? 'Plex' : x.media === 'jellyfin' ? 'Jellyfin' : (SVC[x.service] ? SVC[x.service].name : 'JBL'); }
    if (type === 'cont' && it.media) {
      var sm = $('hSrc'); sm.innerHTML = '';
      var dm = document.createElement('i'); dm.style.background = it.media === 'plex' ? '#E5A00D' : it.media === 'jellyfin' ? '#AA5CC3' : (SVC[it.service] ? SVC[it.service].color : '#888'); sm.appendChild(dm);
      sm.appendChild(document.createTextNode(mediaName(it) + ' · verder kijken' + (it.media === 'jbl' ? ' · op de JBL' : '')));
      $('hTitle').textContent = it.t;
      var mm = $('hMeta'); mm.innerHTML = ''; var me = document.createElement('span'); me.textContent = it.sub || ''; mm.appendChild(me);
      $('hDesc').textContent = it.d || '';
      var cm = $('hCta'); cm.innerHTML = '';
      var km = document.createElement('b'); km.textContent = 'OK'; cm.appendChild(km);
      var lm = document.createElement('span'); lm.textContent = 'Verder kijken in ' + mediaName(it); cm.appendChild(lm);
      if (it.p > 0) { var bm = document.createElement('span'); bm.className = 'bar'; bm.innerHTML = '<span></span>'; bm.firstChild.style.width = Math.round(it.p * 100) + '%'; cm.appendChild(bm); }
      if (it.left > 0) { var tm = document.createElement('span'); tm.style.color = 'var(--ink-3)'; tm.textContent = 'nog ' + it.left + ' min'; cm.appendChild(tm); }
      setBackdrop(it.img);
      return;
    }
    if (type === 'svc' || type === 'pick' || (type === 'cont' && it.service)) {
      var sv = SVC[type === 'svc' ? it.key : it.service] || { name:'', color:'#999' };
      var s0 = $('hSrc'); s0.innerHTML = '';
      var d0 = document.createElement('i'); d0.style.background = sv.color; s0.appendChild(d0);
      s0.appendChild(document.createTextNode(type === 'svc' ? 'Streamingdienst' + (it.jbl ? ' · via JBL' : '') : sv.name + ' · ' + (it.kind || '')));
      $('hTitle').textContent = it.t;
      var m0 = $('hMeta'); m0.innerHTML = '';
      (it.meta || []).forEach(function(x, k){ if (!x) return; if (m0.children.length) { var sp = document.createElement('span'); sp.className = 'sep'; m0.appendChild(sp); } var e = document.createElement('span'); e.textContent = x; m0.appendChild(e); });
      $('hDesc').textContent = it.d || '';
      var c0 = $('hCta'); c0.innerHTML = '';
      var k0 = document.createElement('b'); k0.textContent = 'OK'; c0.appendChild(k0);
      var l0 = document.createElement('span'); l0.textContent = 'Open ' + sv.name + (it.jbl || (type !== 'svc' && SVC[it.service] && viaJbl(SVC[it.service])) ? ' op de JBL' : ''); c0.appendChild(l0);
      setBackdrop(it.img);
      return;
    }
    var s = $('hSrc'); s.innerHTML = '';
    if (it.cat) {
      var cd = document.createElement('i'); cd.style.background = SRC.iptv.c; s.appendChild(cd);
      s.appendChild(document.createTextNode('Live tv · Categorie'));
    } else if (it.app && type === 'live') {
      var zd = document.createElement('i'); zd.style.background = SRC.ziggo.c; s.appendChild(zd);
      s.appendChild(document.createTextNode('Ziggo · App'));
    } else if (type === 'live' && !it.setup && !it.loading) {
      var l = document.createElement('span'); l.className = 'live'; l.textContent = '● LIVE'; s.appendChild(l);
      s.appendChild(document.createTextNode((it.ch || '') + (it.num ? ' · ' + it.num : '')));
    } else {
      var dot = document.createElement('i'); dot.style.background = src.c; s.appendChild(dot);
      s.appendChild(document.createTextNode(type === 'app' ? 'App' : (type === 'live' ? 'Live tv' : src.n + ' · ' + it.kind)));
    }
    $('hTitle').textContent = it.t;
    var m = $('hMeta'); m.innerHTML = '';
    (it.meta || []).forEach(function(x, k){
      if (k) { var d = document.createElement('span'); d.className = 'sep'; m.appendChild(d); }
      var e = document.createElement('span'); e.textContent = x; m.appendChild(e);
    });
    if (it.tag) { var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = it.tag; m.appendChild(tg); }
    $('hDesc').textContent = it.d || '';
    var c = $('hCta'); c.innerHTML = '';
    function add(text, dim){ var e = document.createElement('span'); e.textContent = text; if (dim) e.style.color = 'var(--ink-3)'; c.appendChild(e); }
    function bar(p){ var b = document.createElement('span'); b.className = 'bar'; b.innerHTML = '<span></span>'; b.firstChild.style.width = Math.round(p*100)+'%'; c.appendChild(b); }
    if (it.loading) { add('Even geduld', true); setBackdrop(it.img); return; }
    var k = document.createElement('b'); k.textContent = 'OK'; c.appendChild(k);
    if (it.setup) add('Instellingen openen');
    else if (it.app) add('Open Ziggo GO');
    else if (it.cat) add('Bekijk ' + it.count + ' zenders');
    else if (type === 'live') { add('Kijk live'); if (it.p > 0) bar(it.p); if (it.next) add(it.next, true); }
    else if (type === 'app') add('Open ' + it.t);
    else if (it.p > 0) { add('Verder kijken'); bar(it.p); add(it.left, true); }
    else add('Afspelen in ' + src.n);
    setBackdrop(it.img);
  }

  function render(){
    var pills = $('nav').children;
    for (var i = 0; i < pills.length; i++) pills[i].classList.toggle('focus', state.nav && i === state.navIdx);
    $('rows').style.transform = 'translateY(' + (-state.row * 340) + 'px)';
    rowEls.forEach(function(re, ri){
      re.row.classList.toggle('above', ri < state.row);
      re.row.classList.toggle('dim', ri > state.row);
      var ci = state.col[ri];
      re.track.style.transform = 'translateX(' + (-ci * re.w) + 'px)';
      var cards = re.track.children;
      for (var k = 0; k < cards.length; k++) {
        cards[k].classList.toggle('focus', !state.nav && ri === state.row && k === ci);
        cards[k].style.opacity = (!re.grid && k < ci) ? '0' : '1';
      }
    });
    var r = ROWS[state.row];
    if (r && r.items.length) hero(r.items[state.col[state.row]], r.type);
  }

  var toastT;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 2400);
  }

  function enter(){
    if (state.nav) {
      var n = NAV[state.navIdx];
      if (n === 'Thuis') { state.nav = false; if (state.view !== 'home') closeCategory(); else { state.row = 0; render(); } }
      else if (n === 'Live tv') { if (APP) PL.playLast(); else toast('Live tv opent in de app op de tv'); }
      else if (n === 'Apps') { state.nav = false; if (state.view !== 'home') closeCategory(); state.home = { row: state.row, col: state.col.slice() }; state.view = 'apps'; state.row = 0; state.col = []; buildRows(); }
      else if (n === 'Instellingen') openSettings();
      return;
    }
    var r = ROWS[state.row], it = r.items[state.col[state.row]];
    if (!it) return;
    if (it.setup) { openSettings(); return; }
    if (it.loading) return;
    if (it.app && it.pkg) { if (APP) PL.launch(it.pkg); else toast('Ziggo GO wordt geopend'); return; }
    if (it.cat) { openCategory(it); return; }
    if (it.media) { if (APP && PL.openMedia) PL.openMedia(it.media, it.key); else toast('Opent in ' + it.media); return; }
    if (r.type === 'svc') { openService(it.key); return; }
    if (r.type === 'pick' || (r.type === 'cont' && it.service)) { openService(it.service, it); return; }
    if (r.type === 'live') { if (APP && it.streamId) PL.play(it.streamId, it.catId); else toast('Live: ' + it.ch + ' · ' + it.t); }
    else if (r.type === 'app') { if (APP && it.pkg) PL.launch(it.pkg); else toast(it.t + ' wordt geopend'); }
    else toast('Dit is een voorbeeld. De koppeling met Plex volgt.');
  }

  // ---------- live en apps uit Android ----------
  function mapChannel(c, i){
    var now = c.now || {}, nx = c.next, p = 0, meta = [];
    if (now.start && now.end && now.end > now.start) {
      p = Math.max(0, Math.min(1, (Date.now() - now.start) / (now.end - now.start)));
      meta = [hm(now.start) + ' tot ' + hm(now.end)];
    }
    return { t: now.title || c.name, ch: c.name, num: c.num, s:'iptv', kind:'Live', img: IMGS[i % IMGS.length], logo: c.icon,
             meta: meta, p: p, next: nx ? 'Daarna ' + (nx.start ? hm(nx.start) + ' ' : '') + nx.title : '', d: now.desc || '',
             streamId: c.id, catId: state.cat ? state.cat.cat : '' };
  }

  function loadLive(){
    if (!APP) return;
    PL.liveCategories(function(ok, payload){
      if (!ok) {
        data.cats = [{ t:'Dispatcharr niet bereikbaar', ch:'Live tv', s:'iptv', kind:'Live tv', img:'aurora', meta:[], p:0, setup:true,
          d:'Fout: ' + payload + '. Controleer de server en je login in Instellingen.' }];
        data.liveSub = 'geen verbinding'; composeLive(); if (state.view === 'home') buildRows(); return;
      }
      var res = JSON.parse(payload);
      if (!res.configured) {
        data.cats = [{ t:'Live tv instellen', ch:'Live tv', s:'iptv', kind:'Live tv', img:'aurora', meta:[], p:0, setup:true,
          d:'Vul één keer het adres van Dispatcharr en je Xtream-login in. Daarna staan hier je categorieën.' }];
        data.liveSub = 'nog niet ingesteld'; composeLive(); if (state.view === 'home') buildRows(); return;
      }
      data.cats = res.categories.map(function(c, i){
        return { t:c.name, ch:c.name, s:'iptv', kind:'Categorie', img:c.img || catImg(c.name, i), meta:[c.count + ' zenders'], p:0,
                 count:c.count, cat:c.id, d: c.sample && c.sample.length ? 'Onder andere ' + c.sample.join(', ') + '.' : '' };
      });
      data.liveSub = 'Dispatcharr · ' + res.total + ' zenders';
      composeLive(); if (state.view === 'home') buildRows();
    });
  }

  function openCategory(it){
    state.home = { row: state.row, col: state.col.slice() };
    state.view = 'cat'; state.cat = it; state.row = 0; state.col = []; state.nav = false;
    data.catSub = 'laden…'; data.catGroups = null;
    data.catChannels = [{ t:'Zenders laden…', ch:it.t, s:'iptv', kind:'Live', img:it.img, meta:[], p:0, d:'', loading:true }];
    buildRows();
    if (!APP && /sport/i.test(it.t)) {
      data.catGroups = ['Ziggo Sport','ESPN','F1','Overige sport'].map(function(n){ return { name:n, items:SAMPLE_LIVE.map(function(x){ var y = {}; for (var k in x) y[k] = x[k]; return y; }) }; });
      buildRows(); return;
    }
    if (!APP) {
      data.catChannels = SAMPLE_LIVE.concat(SAMPLE_LIVE).map(function(x){ var y = {}; for (var k in x) y[k] = x[k]; return y; });
      data.catSub = data.catChannels.length + ' zenders'; buildRows(); return;
    }
    PL.liveCategory(it.cat, function(ok, payload){
      if (state.view !== 'cat' || state.cat !== it) return;
      if (!ok) { data.catChannels = [{ t:'Laden mislukt', ch:it.t, s:'iptv', kind:'Live', img:it.img, meta:[], p:0, d:payload, loading:true }]; buildRows(); return; }
      var res = JSON.parse(payload);
      if (res.groups) {
        data.catGroups = res.groups.map(function(g){
          return { name:g.name, items:g.channels.map(function(c, i){ var m = mapChannel(c, i); m.catId = g.id; return m; }) };
        });
        buildRows(); return;
      }
      data.catChannels = res.channels.map(mapChannel);
      data.catSub = data.catChannels.length + ' zenders';
      buildRows();
    });
  }

  function closeCategory(){
    state.view = 'home'; state.cat = null; data.catGroups = null;
    if (state.home) { state.row = state.home.row; state.col = state.home.col; }
    buildRows();
  }

  function loadApps(){
    if (!APP) return;
    PL.apps(function(ok, payload){
      if (!ok) return;
      var list = JSON.parse(payload);
      data.apps = list.map(function(a, i){ return { t:a.label, s:'app', pkg:a.pkg, banner:a.banner, icon:a.icon, img: IMGS[i % IMGS.length], d:'' }; });
      var z = list.filter(function(a){ return a.pkg === 'com.ziggo.tv' || /ziggo/i.test(a.label); })[0];
      data.ziggo = z ? z.pkg : null;
      composeLive(); buildRows();
    });
  }

  function loadStreaming(){
    if (!APP || !PL.streamingHome) return;
    PL.streamingHome(function(ok, payload){
      if (!ok) return;
      var res = JSON.parse(payload);
      if (!res.configured) return;
      data.svcBd = res.services || {};
      data.picks = (res.picks || []).map(function(p){
        return { t:p.title, s:'pick', service:p.service, kind:p.type, img:p.backdrop, thumb:p.thumb,
                 meta:[p.year, p.rating ? '★ ' + p.rating.toFixed(1) : ''], d:p.overview };
      });
      if (state.view === 'home') buildRows();
    });
  }

  function loadContinue(){
    if (!APP || !PL.continueWatching) return;
    PL.continueWatching(function(ok, payload){
      if (!ok) return;
      var res = JSON.parse(payload);
      data.media = (res.items || []).map(function(m){
        return { t:m.title, s:'cont', media:m.source, service:m.service || '', key:m.key, sub:m.sub, d:m.overview, img:m.backdrop, thumb:m.thumb,
                 p:m.progress || 0, left:m.left, kind:'Verder kijken' };
      });
      if (state.view === 'home') buildRows();
    });
  }

  window.__resume = function(){ loadContinue(); loadLive(); loadApps(); data.recent = loadRecent(); };
  window.__back = function(){
    if (!$('settings').hidden) { settingsBack(); return; }
    if (state.view !== 'home') { closeCategory(); return; }
    state.nav = false; state.row = 0; state.col[0] = 0; render();
  };

  // ---------- instellingen ----------
  var sItems = ['sServer','sUser','sPass','sFormat','sGroup','sTmdb','sPlexUrl','sPlexTok','sJfUrl','sJfKey','sJbl','sTest','sSave','sClose','sAndroid','sUpdate'];
  var update = null;
  function checkUpdate(silent){
    if (!APP || !PL.checkUpdate) return;
    PL.checkUpdate(function(ok, payload){
      if (!ok) { $('sVersion').textContent = 'Kan GitHub niet bereiken'; return; }
      update = JSON.parse(payload);
      $('sVersion').textContent = update.newer
        ? 'Versie ' + update.latest + ' staat klaar (je hebt ' + update.current + ')'
        : 'Je hebt de nieuwste versie (' + update.current + ')';
      if (update.newer && silent) toast('Nieuwe versie ' + update.latest + ' beschikbaar, zie Instellingen');
    });
  }
  var sIdx = 0;
  function sRender(){ sItems.forEach(function(id, i){ $(id).classList.toggle('sf', i === sIdx); }); try { $(sItems[sIdx]).scrollIntoView({ block:'nearest' }); } catch (e) {} }
  function openSettings(){
    var cfg = { server:'', user:'', pass:'', format:'ts', categories:'' };
    if (APP) { try { cfg = PL.getSettings(); } catch (e) {} }
    $('sServer').value = cfg.server || ''; $('sUser').value = cfg.user || ''; $('sPass').value = cfg.pass || '';
    $('sFormat').textContent = cfg.format || 'ts'; $('sGroup').value = cfg.categories || ''; $('sTmdb').value = cfg.tmdbToken || ''; $('sJbl').value = cfg.jblWebhook || ''; $('sPlexUrl').value = cfg.plexUrl || ''; $('sPlexTok').value = cfg.plexToken || ''; $('sJfUrl').value = cfg.jellyfinUrl || ''; $('sJfKey').value = cfg.jellyfinKey || '';
    $('sStatus').textContent = '';
    $('settings').hidden = false; state.nav = false; sIdx = 0; sRender();
    checkUpdate(false);
  }
  function closeSettings(){ $('settings').hidden = true; if (document.activeElement) document.activeElement.blur(); render(); }
  function editing(){ var a = document.activeElement; return a && a.tagName === 'INPUT'; }
  function settingsBack(){ if (editing()) document.activeElement.blur(); else closeSettings(); }
  function collect(){ return { server:$('sServer').value, user:$('sUser').value, pass:$('sPass').value, format:$('sFormat').textContent, categories:$('sGroup').value, tmdbToken:$('sTmdb').value, jblWebhook:$('sJbl').value, plexUrl:$('sPlexUrl').value, plexToken:$('sPlexTok').value, jellyfinUrl:$('sJfUrl').value, jellyfinKey:$('sJfKey').value }; }
  function sActivate(){
    var id = sItems[sIdx], el = $(id);
    if (el.tagName === 'INPUT') { el.focus(); return; }
    if (id === 'sFormat') { el.textContent = el.textContent === 'ts' ? 'm3u8' : 'ts'; return; }
    if (id === 'sClose') { closeSettings(); return; }
    if (id === 'sAndroid') { if (APP && PL.systemSettings) PL.systemSettings(); return; }
    if (id === 'sUpdate') {
      if (!APP || !PL.installUpdate) { $('sVersion').textContent = 'Dit werkt alleen in de app op de tv.'; return; }
      $('sVersion').textContent = 'Downloaden…';
      PL.installUpdate(function(ok, payload){
        if (!ok) { $('sVersion').textContent = 'Mislukt: ' + payload; return; }
        $('sVersion').textContent = payload === 'permission'
          ? 'Zet "Thuis" aan bij installeren van apps, ga terug en druk nog een keer op Bijwerken.'
          : 'Installatiescherm geopend';
      });
      return;
    }
    if (!APP) { $('sStatus').textContent = 'Dit werkt alleen in de app op de tv.'; return; }
    PL.saveSettings(collect());
    if (id === 'sSave') { closeSettings(); toast('Opgeslagen'); loadLive(); loadStreaming(); loadContinue(); return; }
    $('sStatus').textContent = 'Verbinden…';
    PL.test(function(ok, payload){
      if (!ok) { $('sStatus').textContent = 'Mislukt: ' + payload; return; }
      var r = JSON.parse(payload);
      $('sStatus').textContent = 'Gelukt. ' + r.channels + ' zenders gevonden' + (r.status ? ' (account: ' + r.status + ')' : '') + '.';
    });
  }
  function settingsKey(e){
    var k = e.key;
    if (editing()) {
      if (k === 'Enter' || k === 'Escape') { e.preventDefault(); document.activeElement.blur(); }
      return;
    }
    var handled = true;
    if (k === 'ArrowDown' || k === 'ArrowRight') sIdx = Math.min(sItems.length - 1, sIdx + 1);
    else if (k === 'ArrowUp' || k === 'ArrowLeft') sIdx = Math.max(0, sIdx - 1);
    else if (k === 'Enter' || e.keyCode === 23) sActivate();
    else if (k === 'Escape' || k === 'Backspace' || e.keyCode === 461) closeSettings();
    else handled = false;
    if (handled) { e.preventDefault(); sRender(); }
  }
  sItems.forEach(function(id, i){
    $(id).addEventListener('click', function(){ sIdx = i; sRender(); if ($(id).tagName !== 'INPUT') sActivate(); });
  });

  // ---------- toetsen ----------
  document.addEventListener('keydown', function(e){
    if (!$('settings').hidden) { settingsKey(e); return; }
    var k = e.key, code = e.keyCode, handled = true;
    var rowLen = ROWS[state.row] ? ROWS[state.row].items.length : 0;
    if (k === 'ArrowUp') {
      if (!state.nav) { if (state.row === 0) state.nav = true; else { var pc = state.col[state.row]; state.row--; if (ROWS[state.row].grid) state.col[state.row] = Math.min(pc, ROWS[state.row].items.length - 1); } }
    } else if (k === 'ArrowDown') {
      if (state.nav) state.nav = false;
      else { var oc = state.col[state.row], or = state.row; state.row = Math.min(ROWS.length - 1, state.row + 1);
        if (state.row !== or && ROWS[state.row].grid) state.col[state.row] = Math.min(oc, ROWS[state.row].items.length - 1); }
    } else if (k === 'ArrowLeft') {
      if (state.nav) state.navIdx = Math.max(0, state.navIdx - 1);
      else state.col[state.row] = Math.max(0, state.col[state.row] - 1);
    } else if (k === 'ArrowRight') {
      if (state.nav) state.navIdx = Math.min(NAV.length - 1, state.navIdx + 1);
      else state.col[state.row] = Math.min(rowLen - 1, state.col[state.row] + 1);
    } else if (k === 'Enter' || code === 23) {
      enter();
    } else if (k === 'Escape' || k === 'Backspace' || k === 'GoBack' || k === 'BrowserBack' || code === 461) {
      if (state.view !== 'home') { closeCategory(); e.preventDefault(); return; }
      state.nav = false; state.row = 0; state.col[0] = 0;
    } else handled = false;
    if (handled) { e.preventDefault(); render(); }
  });

  buildRows();
  if (APP) {
    loadLive(); loadApps(); loadStreaming(); loadContinue();
    setInterval(loadLive, 5 * 60 * 1000);
    setInterval(loadStreaming, 3 * 3600 * 1000);
    setTimeout(function(){ checkUpdate(true); }, 4000);
  }
})();
</script>
</body>
