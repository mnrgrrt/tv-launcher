name: tv-serverr bouwen

on:
  push:
    branches: [main]
    paths: ['server/**', 'shared/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          build-args: VERSION=${{ github.run_number }}
          tags: |
            ghcr.io/mnrgrrt/tv-serverr:latest
            ghcr.io/mnrgrrt/tv-serverr:${{ github.run_number }}
