name: APK bouwen

on:
  push:
    branches: [main, thuis-1]
    # Alleen een nieuwe Thuis als de app zelf verandert, niet bij wijzigingen aan tv-serverr.
    paths: ['app/**', 'shared/**', 'tizen/**', 'build.gradle.kts', 'settings.gradle.kts', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signeersleutel klaarzetten
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/thuis.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/thuis.jks" >> "$GITHUB_ENV"
          else
            echo "Geen signeersleutel ingesteld, debug-sleutel wordt gebruikt."
          fi

      - name: Bouwen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: thuis
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK hernoemen
        run: |
          cp app/build/outputs/apk/release/app-release.apk "thuis-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk thuis.apk

      - name: Samsung-pakket (Tizen) maken
        run: |
          set -e
          mkdir -p build-tizen
          cp -r shared/web/. build-tizen/
          cp shared/categories.json build-tizen/
          cp tizen/config.xml tizen/icon.png tizen/thuis-tizen.js build-tizen/
          # Platformlaag laden vóór het script van het startscherm
          sed -i 's#<head>#<head>\n<script src="thuis-tizen.js"></script>#' build-tizen/index.html
          grep -q 'thuis-tizen.js' build-tizen/index.html
          sed -i "s#version=\"1.0.0\"#version=\"1.0.${GITHUB_RUN_NUMBER}\"#" build-tizen/config.xml
          (cd build-tizen && zip -qr ../thuis-samsung-ongesigneerd.wgt .)

      - uses: actions/upload-artifact@v4
        with:
          name: thuis-apk
          path: thuis-*.apk

      - name: Versienummer bepalen
        run: |
          read MAJOR BASE < app/versie.txt
          if [ "$GITHUB_REF_NAME" = "main" ]; then V=$(printf "%d.%02d" $MAJOR $(( GITHUB_RUN_NUMBER - BASE > 0 ? GITHUB_RUN_NUMBER - BASE : 0 )));
          else V="$MAJOR.00-test.$GITHUB_RUN_NUMBER"; fi
          echo "VERSIE=$V" >> "$GITHUB_ENV"

      - name: Release "laatste" bijwerken
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete laatste --yes --cleanup-tag || true
          gh release create laatste "thuis-${GITHUB_RUN_NUMBER}.apk" thuis.apk thuis-samsung-ongesigneerd.wgt \
            --title "Thuis $VERSIE" \
            --notes "Automatisch gebouwd uit ${GITHUB_SHA::7}." \
            --latest

      - name: Testversie (release "test") bijwerken
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test --yes --cleanup-tag || true
          gh release create test "thuis-${GITHUB_RUN_NUMBER}.apk" thuis.apk --target "$GITHUB_SHA" --prerelease \
            --title "Thuis $VERSIE (test)" \
            --notes "Testversie uit tak ${GITHUB_REF_NAME}, ${GITHUB_SHA::7}. Niet voor gewoon gebruik."
